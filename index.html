<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>Jump Robot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .tip {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 99;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }

        .layer {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ffe66d;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 99;
            font-size: 28px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            text-align: right;
            line-height: 1.2;
        }

        .layer small {
            display: block;
            font-size: 12px;
            color: #aaa;
            font-weight: normal;
            margin-top: 4px;
        }

        .best {
            color: #6dff8e;
        }

        #startOverlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #fff;
        }

        #startOverlay h1 {
            font-size: 56px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffe66d, #ff6b6b, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 230, 109, 0.3);
        }

        #startOverlay p {
            font-size: 16px;
            color: #aab;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.8;
        }

        #startBtn {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border: none;
            padding: 18px 60px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(238, 90, 111, 0.4);
        }

        #startBtn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(238, 90, 111, 0.6);
        }

        #startBtn:disabled {
            background: #555;
            cursor: wait;
            box-shadow: none;
        }

        #escMenu {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(6px);
        }

        #escMenu h2 {
            color: #fff;
            font-size: 36px;
            margin-bottom: 40px;
        }

        #escMenu button {
            display: block;
            width: 240px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border: none;
            padding: 16px 0;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        #btnRestart {
            background: linear-gradient(135deg, #4a90e2, #357abd);
        }

        #btnRestart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        #btnQuit {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }

        #btnQuit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(238, 90, 111, 0.4);
        }

        #escMenu .hint {
            color: #888;
            font-size: 13px;
            margin-top: 12px;
        }

        /* 背景音乐（隐藏，不可见） */
        #bgMusic {
            display: none;
        }
    </style>
</head>

<body>
    <!-- 背景音乐：进入游戏播放，退出游戏暂停 -->
    <audio id="bgMusic" src="assets/bg-music.mp4" loop preload="auto"></audio>

    <!-- 开始界面 -->
    <div id="startOverlay">
        <h1>Jump Robot</h1>
        <p>
            往上跳！随机平台不断生成，看你能跳多高<br>
            WASD 移动 | Shift 冲刺 | 空格跳跃 | 鼠标转视角 | ESC / P 暂停<br>
            冲刺时跳跃更高更远，岩浆会从下方缓慢追上来，碰到就死
        </p>
        <button id="startBtn">开始游戏</button>
    </div>

    <!-- 游戏UI（加载完成后显示） -->
    <div class="tip" style="display:none;">
        点击锁定鼠标 | WASD移动 | Shift冲刺 | 空格跳跃 | 鼠标转视角 | ESC/P 暂停 | 往上跳，别被岩浆追上
    </div>
    <div class="layer" style="display:none;">
        <span id="layerNow">0</span> 层
        <small>最高：<span id="layerBest" class="best">0</span> 层</small>
    </div>

    <!-- ESC菜单 -->
    <div id="escMenu">
        <h2>暂停</h2>
        <button id="btnRestart">重新开始</button>
        <button id="btnQuit">退出游戏</button>
        <div class="hint">按 ESC 关闭菜单继续游戏</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ============== 1. 场景初始化 ==============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ============== 2. 灯光 ==============
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(20, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -60;
        dirLight.shadow.camera.right = 60;
        dirLight.shadow.camera.top = 60;
        dirLight.shadow.camera.bottom = -60;
        scene.add(dirLight);

        // ============== 3. 平台系统 ==============
        const LAYER_HEIGHT = 3.0;          // 每层高度间隔
        const PLATFORM_SIZE = 5;           // 平台边长（加大，更易落脚）
        const PLATFORM_THICK = 0.5;        // 平台厚度
        const RANGE = 8;                   // 平台水平随机范围（加大，更分散）
        const PLATFORMS_PER_LAYER = 4;     // 每层平台数量（增多，更易跳）

        const platforms = [];
        const platformGeo = new THREE.BoxGeometry(PLATFORM_SIZE, PLATFORM_THICK, PLATFORM_SIZE);

        function layerColor(layer) {
            const palette = [
                0x4a90e2, 0x50c878, 0xf4a460, 0xff6b6b,
                0x9b59b6, 0x1abc9c, 0xe67e22, 0xecf0f1
            ];
            return palette[((layer % palette.length) + palette.length) % palette.length];
        }

        // 关键：topY = layer * LAYER_HEIGHT，第0层平台顶面在 y=0
        function createPlatform(layer, x, z, size = PLATFORM_SIZE) {
            const useGeo = (size === PLATFORM_SIZE) ? platformGeo : new THREE.BoxGeometry(size, PLATFORM_THICK, size);
            const mat = new THREE.MeshLambertMaterial({ 
                color: layerColor(layer),
                transparent: true,
                opacity: 1.0
            });
            const mesh = new THREE.Mesh(useGeo, mat);
            const topY = layer * LAYER_HEIGHT;
            mesh.position.set(x, topY - PLATFORM_THICK / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const half = size / 2;
            const p = {
                mesh,
                x, z, layer, size,
                topY,
                minX: x - half,
                maxX: x + half,
                minZ: z - half,
                maxZ: z + half
            };
            platforms.push(p);
            return p;
        }

        function generateLayer(layer) {
            if (layer === 0) {
                // 第 0 层大地面平台（50×50），玩家跑不出去，下面没有东西
                createPlatform(0, 0, 0, 50);
                return;
            }
            // 同层平台间最小间距（边到边），避免重叠
            const minGap = 1.5;
            const placed = []; // 记录本层已放置的平台中心
            let attempts = 0;
            while (placed.length < PLATFORMS_PER_LAYER && attempts < 30) {
                const x = (Math.random() * 2 - 1) * RANGE;
                const z = (Math.random() * 2 - 1) * RANGE;
                // 检查与已放置平台的间距
                let ok = true;
                for (const q of placed) {
                    const dx = Math.abs(x - q.x);
                    const dz = Math.abs(z - q.z);
                    // 边到边距离 = 中心距 - 两个半边长
                    if (dx < PLATFORM_SIZE + minGap && dz < PLATFORM_SIZE + minGap) {
                        ok = false;
                        break;
                    }
                }
                if (ok) {
                    createPlatform(layer, x, z);
                    placed.push({ x, z });
                }
                attempts++;
            }
            // 保底：如果尝试多次没放够，剩余的直接随机放（不重叠也比没平台强）
            while (placed.length < PLATFORMS_PER_LAYER) {
                const x = (Math.random() * 2 - 1) * RANGE;
                const z = (Math.random() * 2 - 1) * RANGE;
                createPlatform(layer, x, z);
                placed.push({ x, z });
            }
        }

        let highestGeneratedLayer = 0;
        let lowestGeneratedLayer = 0;
        for (let l = 0; l <= 5; l++) {
            generateLayer(l);
            highestGeneratedLayer = l;
        }

        // ============== 4. 玩家（Group + GLTF模型） ==============
        // 用 group 作为物理载体，position.y 即脚底高度
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0); // 第0层平台顶面 y=0
        playerGroup.visible = false; // 加载完成前隐藏
        scene.add(playerGroup);

        // 模型与动画
        let mixer = null;
        let walkAction = null, idleAction = null, jumpAction = null, runAction = null;
        let currentAnimation = 'idle';
        let modelLoaded = false;
        let gameStarted = false;

        // 死亡动画相关
        let deathModel = null;          // 机器人模型引用（playerGroup 的子节点）
        let deathMaterials = [];        // 模型上所有原始 MeshStandardMaterial（保存原始 emissive）
        let deathStartY = 0;            // 触发死亡时玩家的 Y 位置（用于下沉计算）

        // 加载模型（由开始按钮触发）
        function loadModel() {
            const loader = new GLTFLoader();
            loader.load(
                'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
                function (gltf) {
                    const model = gltf.scene;
                    model.scale.set(0.3, 0.3, 0.3);
                    model.castShadow = true;
                    playerGroup.add(model);
                    playerGroup.visible = true;

                    mixer = new THREE.AnimationMixer(model);
                    const animations = gltf.animations;

                    const find = (re) => animations.find(a => re.test(a.name.toLowerCase()));
                    const walkAnim = find(/walk|walking/);
                    const runAnim = find(/run|running/);
                    const idleAnim = find(/idle|standing/);
                    const jumpAnim = find(/jump|jumping/);

                    walkAction = mixer.clipAction(walkAnim || animations[0]);
                    runAction = mixer.clipAction(runAnim || walkAnim || animations[0]);
                    idleAction = mixer.clipAction(idleAnim || animations[0]);
                    jumpAction = mixer.clipAction(jumpAnim || animations[0]);

                    walkAction.setEffectiveWeight(1);
                    runAction.setEffectiveWeight(1);
                    idleAction.setEffectiveWeight(1);
                    jumpAction.setEffectiveWeight(1);
                    idleAction.play();

                    // 收集模型上所有 MeshStandardMaterial，用于死亡动画变红
                    deathModel = model;
                    deathMaterials = [];
                    model.traverse((child) => {
                        if (child.isMesh && child.material) {
                            const mats = Array.isArray(child.material) ? child.material : [child.material];
                            mats.forEach((m) => {
                                if (m.isMeshStandardMaterial) {
                                    deathMaterials.push({
                                        mat: m,
                                        origEmissiveR: m.emissive.r,
                                        origEmissiveG: m.emissive.g,
                                        origEmissiveB: m.emissive.b,
                                        origEmissiveI: m.emissiveIntensity,
                                    });
                                }
                            });
                        }
                    });

                    modelLoaded = true;
                    onModelReady();
                },
                (progress) => {
                    if (progress.total) {
                        const ratio = progress.loaded / progress.total;
                        const percent = Math.min(99, Math.floor(ratio * 100));
                        startBtn.textContent = `加载中... ${percent}%`;
                    }
                },
                function (error) {
                    console.error('模型加载失败：', error);
                    startBtn.textContent = '加载失败，点击重试';
                    startBtn.disabled = false;
                }
            );
        }

        // 模型加载完成 → 进入游戏
        function onModelReady() {
            gameStarted = true;
            // 隐藏开始界面
            document.getElementById('startOverlay').style.display = 'none';
            // 显示游戏UI
            document.querySelector('.tip').style.display = 'block';
            document.querySelector('.layer').style.display = 'block';
            // 播放背景音乐
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.currentTime = 0;
            bgMusic.play().catch(err => console.warn('背景音乐播放失败：', err));
        }

        // ============== 5. 控制系统 ==============
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        let yaw = 0;
        const mouseSens = 0.002;
        const moveSpeed = 8;
        const runSpeedMultiplier = 1.6;     // Shift 奔跑速度倍率
        const dashJumpMultiplier = 1.5;     // 奔跑时跳跃力倍率（冲刺跳更高更远）
        const gravity = -25;
        const jumpPower = 13;               // 普通跳跃力足够跳上一层
        let velY = 0;
        let isGrounded = true;
        let currentPlatform = null;

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            else if (k === 'a') keys.a = true;
            else if (k === 's') keys.s = true;
            else if (k === 'd') keys.d = true;
            else if (k === ' ') { keys.space = true; e.preventDefault(); }
            if (e.key === 'Shift') keys.shift = true;
        });

        document.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            else if (k === 'a') keys.a = false;
            else if (k === 's') keys.s = false;
            else if (k === 'd') keys.d = false;
            else if (k === ' ') keys.space = false;
            if (e.key === 'Shift') keys.shift = false;
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * mouseSens;
            }
        });

        // ============== 6. 层数统计 ==============
        let currentLayer = 0;
        let bestLayer = 0;
        const layerNowEl = document.getElementById('layerNow');
        const layerBestEl = document.getElementById('layerBest');

        function updateLayerDisplay() {
            layerNowEl.textContent = currentLayer;
            layerBestEl.textContent = bestLayer;
        }
        updateLayerDisplay();

        // ============== 7. 动画状态切换 ==============
        function switchAnimation(target) {
            if (!modelLoaded || currentAnimation === target) return;
            const fade = 0.15;
            if (currentAnimation === 'walk') walkAction.fadeOut(fade);
            else if (currentAnimation === 'run') runAction.fadeOut(fade);
            else if (currentAnimation === 'idle') idleAction.fadeOut(fade);
            else if (currentAnimation === 'jump') jumpAction.fadeOut(fade);

            if (target === 'walk') walkAction.reset().fadeIn(fade).play();
            else if (target === 'run') runAction.reset().fadeIn(fade).play();
            else if (target === 'idle') idleAction.reset().fadeIn(fade).play();
            else if (target === 'jump') jumpAction.reset().fadeIn(fade).play();

            currentAnimation = target;
        }

        // ============== 8. 平台动态生成与清理 ==============
        function managePlatforms() {
            const playerLayerApprox = Math.round(playerGroup.position.y / LAYER_HEIGHT);

            // 只往上生成（第0层是地板，下面不再生成）
            // 生成 12 层以上的余量，保证跳跃时不会"空窗"
            while (highestGeneratedLayer < playerLayerApprox + 12) {
                highestGeneratedLayer++;
                generateLayer(highestGeneratedLayer);
            }

            // 关键修复：只清理玩家下方太远的平台（第0层除外）
            // 不清理玩家上方的平台 —— 这样即使掉回低层，之前生成的高层平台仍在
            const minKeepLayer = playerLayerApprox - 10;
            for (let i = platforms.length - 1; i >= 0; i--) {
                const p = platforms[i];
                if (p.layer < minKeepLayer && p.layer !== 0) {
                    scene.remove(p.mesh);
                    p.mesh.material.dispose();
                    platforms.splice(i, 1);
                }
            }
        }

        // ============== 9. 落地检测（前后帧穿越法） ==============
        // 上一帧脚底在平台顶面之上，本帧到顶面之下 → 落地
        function tryLanding(prevFootY, newFootY) {
            const px = playerGroup.position.x;
            const pz = playerGroup.position.z;
            let best = null;
            for (const p of platforms) {
                if (prevFootY >= p.topY - 0.01 && newFootY <= p.topY + 0.01) {
                    if (px >= p.minX - 0.3 && px <= p.maxX + 0.3 &&
                        pz >= p.minZ - 0.3 && pz <= p.maxZ + 0.3) {
                        if (!best || p.topY > best.topY) best = p;
                    }
                }
            }
            return best;
        }

        // ============== 9.5 岩浆系统 ==============
        // 官方 Three.js webgl_shader_lava（TheGameMaker 出品，随官方 examples 维护）
        // 纹理通过 three 0.160.0 CDN 加载，岩浆面缓慢上升，碰到玩家即死亡
        const LAVA_SIZE = 100;             // 岩浆平面边长
        const LAVA_RISE_SPEED = 0.8;       // 每秒上升速度
        const LAVA_INITIAL_Y = -8;         // 起始高度（低于第0层平台）
        const LAVA_DEATH_MARGIN = 0.1;     // 玩家脚底低于岩浆面多少即判定死亡
        const DEATH_DURATION = 1.0;        // 死亡动画时长（秒）

        const lavaGeo = new THREE.PlaneGeometry(LAVA_SIZE, LAVA_SIZE, 1, 1);

        // Three.js 官方 webgl_shader_lava：uv 缩放 & 流动速度可调
        const LAVA_UV_SCALE = new THREE.Vector2(10.0, 10.0); // 在 100x100 平面上的平铺密度
        const LAVA_TIME_SCALE = 1.0;  // 对官方 shader 时间系数的整体缩放

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        // 多源回退：npm 包 0.160.0 没打包 examples/textures/lava，因此依次试
        //   1) threejs.org 官方示例（实际渲染页面用的 CDN）
        //   2) GitHub raw（r160 tag 处真实存在）
        // 最后才走 canvas fallback，保证尽量加载到官方原图
        const LAVA_TEXTURE_CANDIDATES = {
            cloud: [
                'https://threejs.org/examples/textures/lava/cloud.png',
                'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/textures/lava/cloud.png'
            ],
            tile: [
                'https://threejs.org/examples/textures/lava/lavatile.jpg',
                'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/textures/lava/lavatile.jpg'
            ]
        };

        // fallback：程序生成的 64x64 伪噪声，加载失败兜底，保证岩浆至少不黑
        function makeFallbackTexture(colorHex, addAlphaNoise = false) {
            const size = 64;
            const cvs = document.createElement('canvas');
            cvs.width = cvs.height = size;
            const ctx = cvs.getContext('2d');
            const c = new THREE.Color(colorHex);
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const n = Math.random();
                    const r = Math.min(255, Math.floor(c.r * 255 * (0.6 + n * 0.8)));
                    const g = Math.min(255, Math.floor(c.g * 255 * (0.6 + n * 0.8)));
                    const b = Math.min(255, Math.floor(c.b * 255 * (0.6 + n * 0.8)));
                    let a = 255;
                    if (addAlphaNoise) {
                        // cloud fallback 需要 alpha 通道也有噪声，兼容 p = max(a, 亮度)
                        a = Math.min(255, Math.floor(n * 255));
                    }
                    ctx.fillStyle = `rgba(${r},${g},${b},${a/255})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(cvs);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // 按候选列表依次尝试加载，第一个成功就用；全部失败则用 canvas fallback
        function loadLavaTexture(candidates, fallbackColor, addAlphaNoise, markSRGB) {
            const texObj = { texture: null };
            function tryNext(idx) {
                if (idx >= candidates.length) {
                    console.warn('[Lava] 所有候选源都加载失败，使用 canvas fallback，最终 fallback URL 列表：', candidates);
                    texObj.texture = makeFallbackTexture(fallbackColor, addAlphaNoise);
                    if (markSRGB) texObj.texture.colorSpace = THREE.SRGBColorSpace;
                    return;
                }
                const url = candidates[idx];
                textureLoader.load(
                    url,
                    (loadedTex) => {
                        console.log(`[Lava] 加载成功：${url}`);
                        loadedTex.wrapS = loadedTex.wrapT = THREE.RepeatWrapping;
                        if (markSRGB) loadedTex.colorSpace = THREE.SRGBColorSpace;
                        texObj.texture = loadedTex;
                    },
                    undefined,
                    () => {
                        console.warn(`[Lava] 候选加载失败，试下一个：${url}`);
                        tryNext(idx + 1);
                    }
                );
            }
            // 先占个位：立即返回一个 fallback 占位，后续加载成功后替换
            texObj.texture = makeFallbackTexture(fallbackColor, addAlphaNoise);
            if (markSRGB) texObj.texture.colorSpace = THREE.SRGBColorSpace;
            tryNext(0);
            return texObj;
        }

        const cloudTexObj = loadLavaTexture(LAVA_TEXTURE_CANDIDATES.cloud, 0xaaaaaa, true, false);
        const tileTexObj  = loadLavaTexture(LAVA_TEXTURE_CANDIDATES.tile,  0xff6a00, false, true);

        const lavaUniforms = {
            fogDensity: { value: 0.0 },   // 场景已有雾，关闭官方 shader 内建指数雾
            fogColor:    { value: new THREE.Color(0x87CEEB) },
            time:        { value: 0.0 },
            uvScale:     { value: LAVA_UV_SCALE.clone() },
            texture1:    { value: cloudTexObj.texture },   // cloud 噪声图
            texture2:    { value: tileTexObj.texture }     // lavatile 熔岩贴图
        };
        // 等候选源加载成功后把材质 uniform 替换为真正的纹理，触发 shader 更新
        function pollTextureSwap(obj, uniformKey) {
            const check = () => {
                const current = lavaUniforms[uniformKey].value;
                if (obj.texture && obj.texture !== current) {
                    current.dispose?.();
                    lavaUniforms[uniformKey].value = obj.texture;
                    lavaMat.needsUpdate = true;
                    return;
                }
                requestAnimationFrame(check);
            };
            requestAnimationFrame(check);
        }
        pollTextureSwap(cloudTexObj, 'texture1');
        pollTextureSwap(tileTexObj, 'texture2');

        // 顶点着色器：官方 webgl_shader_lava 原版 + 传出 vWorldPos 做边缘淡出
        const lavaVertexShader = /* glsl */`
            uniform vec2 uvScale;
            varying vec2 vUv;
            varying vec3 vWorldPos;

            void main() {
                vUv = uvScale * uv;
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPos = worldPos.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        // 片元着色器：Three.js 官方 webgl_shader_lava（TheGameMaker）原版
        // 兼容性修正：
        //   1) cloud.png 某些来源的 alpha 通道无效 → p 取 max(alpha, 亮度)
        //   2) color² - 0.1 可能出现负值 → clamp 到 0，避免大面积黑
        //   3) + 边缘淡出 alpha 融入场景雾
        const lavaFragmentShader = /* glsl */`
            uniform float time;
            uniform float fogDensity;
            uniform vec3  fogColor;
            uniform sampler2D texture1;
            uniform sampler2D texture2;

            varying vec2 vUv;
            varying vec3 vWorldPos;

            void main( void ) {
                vec4 noise = texture2D( texture1, vUv );
                vec2 T1 = vUv + vec2( 1.5, -1.5 ) * time * 0.02;
                vec2 T2 = vUv + vec2( -0.5, 2.0 ) * time * 0.01;

                T1.x += noise.x * 2.0;
                T1.y += noise.y * 2.0;
                T2.x -= noise.y * 0.2;
                T2.y += noise.z * 0.2;

                vec4 cloudSample = texture2D( texture1, T1 * 2.0 );
                float lum = dot( cloudSample.rgb, vec3( 0.299, 0.587, 0.114 ) );
                float p = max( cloudSample.a, lum );  // 兼容 alpha 通道缺失

                vec4 color = texture2D( texture2, T2 * 2.0 );
                vec4 temp = color * ( vec4( p, p, p, p ) * 2.0 ) + ( color * color - 0.1 );

                // 防止负值钳到 0 变成死黑
                temp.rgb = max( temp.rgb, vec3( 0.0 ) );
                temp.a   = max( temp.a, 0.0 );

                if( temp.r > 1.0 ){ temp.bg += clamp( temp.r - 2.0, 0.0, 100.0 ); }
                if( temp.g > 1.0 ){ temp.rb += temp.g - 1.0; }
                if( temp.b > 1.0 ){ temp.rg += temp.b - 1.0; }

                vec3 outCol = temp.rgb;

                // 官方内建指数雾（默认 fogDensity=0 关闭），保留用于扩展
                if ( fogDensity > 0.0 ) {
                    float depth = gl_FragCoord.z / gl_FragCoord.w;
                    const float LOG2 = 1.442695;
                    float fogFactor = exp2( - fogDensity * fogDensity * depth * depth * LOG2 );
                    fogFactor = 1.0 - clamp( fogFactor, 0.0, 1.0 );
                    outCol = mix( outCol, fogColor, fogFactor );
                }

                // 边缘按水平距离淡出，融入远处场景雾
                float distXZ = length(vWorldPos.xz);
                float alpha = 1.0 - smoothstep(30.0, 48.0, distXZ);
                gl_FragColor = vec4(outCol, alpha);
            }
        `;

        const lavaMat = new THREE.ShaderMaterial({
            uniforms: lavaUniforms,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            vertexShader: lavaVertexShader,
            fragmentShader: lavaFragmentShader
        });

        const lavaMesh = new THREE.Mesh(lavaGeo, lavaMat);
        lavaMesh.rotation.x = -Math.PI / 2;
        lavaMesh.position.y = LAVA_INITIAL_Y;
        scene.add(lavaMesh);

        // 岩浆发出的红色辉光，照亮附近的平台与角色
        const lavaLight = new THREE.PointLight(0xff4400, 2.0, 60, 2);
        lavaLight.position.set(0, LAVA_INITIAL_Y + 2, 0);
        scene.add(lavaLight);

        let lavaY = LAVA_INITIAL_Y;
        let deathTimer = 0;   // 死亡动画倒计时，>0 表示正在死亡
        let deathPending = false;  // 死亡后已弹出菜单，等待玩家选择

        function resetLava() {
            lavaY = LAVA_INITIAL_Y;
            lavaMesh.position.y = lavaY;
            lavaLight.position.y = lavaY + 2;
            lavaUniforms.time.value = 0;
        }

        function updateLava(delta) {
            // 缓慢上升
            lavaY += LAVA_RISE_SPEED * delta;
            lavaMesh.position.y = lavaY;
            lavaLight.position.y = lavaY + 2;
            // 着色器时间推进，驱动流动动画
            lavaUniforms.time.value += delta * LAVA_TIME_SCALE;

            // 死亡检测：玩家脚底低于岩浆面
            if (gameStarted && !gamePaused && deathTimer <= 0 &&
                playerGroup.position.y < lavaY - LAVA_DEATH_MARGIN) {
                onPlayerDeath();
            }
        }

        function onPlayerDeath() {
            deathTimer = DEATH_DURATION;
            deathStartY = playerGroup.position.y;
            // 停掉所有当前动画，防止和程序化死亡动画冲突
            [walkAction, runAction, idleAction, jumpAction].forEach(a => {
                if (a) a.fadeOut(0.1);
            });
            // 保持模型可见，进入死亡动画阶段
            playerGroup.visible = true;
        }

        // 死亡动画结束后弹出菜单（替换自动重生）
        function openDeathMenu() {
            deathPending = true;
            escMenu.querySelector('h2').textContent = '你死了';
            escMenu.querySelector('.hint').textContent = '选择重新开始或退出游戏';
            openEscMenu();
        }

        // 恢复暂停菜单的默认文案
        function resetEscMenuText() {
            escMenu.querySelector('h2').textContent = '暂停';
            escMenu.querySelector('.hint').textContent = '按 ESC 关闭菜单继续游戏';
        }

        // ============== 10. 主循环 ==============
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            // 游戏未开始：只渲染静态场景（开始界面背景）
            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            // 暂停：只渲染不更新逻辑
            if (gamePaused) {
                renderer.render(scene, camera);
                return;
            }

            // 死亡动画期间：只更新岩浆流动视觉 + 死亡动画，不更新游戏逻辑
            if (deathTimer > 0) {
                deathTimer -= delta;
                lavaUniforms.time.value += delta * LAVA_TIME_SCALE;

                // 推进 mixer 以完成动画淡出
                if (mixer) mixer.update(delta);

                // --- 死亡动画：红光 + 下沉 + 倾斜 ---
                const deathElapsed = DEATH_DURATION - deathTimer;          // 已过去时间
                const deathHalf = DEATH_DURATION * 0.5;                    // 前半段可见
                const tNorm = Math.min(deathElapsed / deathHalf, 1.0);     // 0→1（前半段）

                // 材质变红（emissiveIntensity 从 0 → 3，颜色从原色渐变到纯红）
                deathMaterials.forEach((d) => {
                    const r = d.origEmissiveR + (1.0 - d.origEmissiveR) * tNorm;
                    const g = d.origEmissiveG * (1.0 - tNorm);
                    const b = d.origEmissiveB * (1.0 - tNorm);
                    d.mat.emissive.setRGB(r, g, b);
                    d.mat.emissiveIntensity = d.origEmissiveI + 3.0 * tNorm;
                });

                // 模型下沉：从死亡触发时的 Y 下沉到岩浆面以下
                const sinkTarget = lavaY - 0.3;
                playerGroup.position.y = deathStartY + (sinkTarget - deathStartY) * tNorm;

                // 沿 X/Z 轴随机轻微倾斜（身体挣扎倒下的感觉）
                const tiltX = Math.sin(deathElapsed * 5.0) * 0.15 * tNorm;
                const tiltZ = Math.cos(deathElapsed * 4.0) * 0.10 * tNorm;
                deathModel.rotation.x = tiltX;
                deathModel.rotation.z = tiltZ;

                // 前半段结束后隐藏模型
                if (deathElapsed >= deathHalf && playerGroup.visible) {
                    playerGroup.visible = false;
                }

                if (deathTimer <= 0) {
                    deathTimer = 0;
                    // 重置模型状态，防止重启时残留旋转/颜色
                    deathModel.rotation.set(0, 0, 0);
                    deathMaterials.forEach((d) => {
                        d.mat.emissive.setRGB(d.origEmissiveR, d.origEmissiveG, d.origEmissiveB);
                        d.mat.emissiveIntensity = d.origEmissiveI;
                    });
                    openDeathMenu();
                }
                renderer.render(scene, camera);
                return;
            }

            if (mixer) mixer.update(delta);

            // 移动方向
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw));
            const right = new THREE.Vector3(1, 0, 0);
            right.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw));

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.sub(forward);
            if (keys.s) moveDir.add(forward);
            if (keys.a) moveDir.add(right);
            if (keys.d) moveDir.sub(right);
            if (moveDir.length() > 0) moveDir.normalize();

            // 奔跑判定
            const isRunning = keys.shift && moveDir.length() > 0;
            const currentMoveSpeed = isRunning ? moveSpeed * runSpeedMultiplier : moveSpeed;

            // 水平移动
            playerGroup.position.x += moveDir.x * currentMoveSpeed * delta;
            playerGroup.position.z += moveDir.z * currentMoveSpeed * delta;

            // 玩家朝向（移动方向）—— RobotExpressive 默认朝 +Z，所以不加 PI
            if (moveDir.length() > 0) {
                const targetYaw = Math.atan2(moveDir.x, moveDir.z);
                let diff = targetYaw - playerGroup.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                playerGroup.rotation.y += diff * 0.2;
            }

            // 跳跃（奔跑时冲刺跳跃，跳更高更远）
            if (keys.space && isGrounded) {
                const mult = isRunning ? dashJumpMultiplier : 1;
                velY = jumpPower * mult;
                isGrounded = false;
                currentPlatform = null;
                switchAnimation('jump');
            }

            // 重力 + 落地检测
            const prevFootY = playerGroup.position.y;
            velY += gravity * delta;
            playerGroup.position.y += velY * delta;
            const newFootY = playerGroup.position.y;

            if (velY <= 0) {
                const landed = tryLanding(prevFootY, newFootY);
                if (landed) {
                    playerGroup.position.y = landed.topY;
                    velY = 0;
                    isGrounded = true;
                    currentPlatform = landed;
                    currentLayer = landed.layer;
                    if (currentLayer > bestLayer) bestLayer = currentLayer;
                    updateLayerDisplay();
                } else {
                    isGrounded = false;
                }
            } else {
                isGrounded = false;
            }

            // 动画切换
            if (isGrounded) {
                if (moveDir.length() > 0) {
                    switchAnimation(isRunning ? 'run' : 'walk');
                } else {
                    switchAnimation('idle');
                }
            }

            // 兜底：第0层是地板，万一掉到 y<0（穿出大平台边缘）就拉回第0层中心
            if (playerGroup.position.y < -0.5) {
                playerGroup.position.set(0, 0, 0);
                velY = 0;
                isGrounded = true;
                currentPlatform = platforms.find(p => p.layer === 0);
                currentLayer = 0;
                updateLayerDisplay();
            }

            // 平台动态管理
            managePlatforms();

            // 岩浆上升与死亡检测
            updateLava(delta);

            // 视线遮挡检测：相机和玩家之间的平台变半透明
            const camPos = camera.position.clone();
            const playerPos = new THREE.Vector3(
                playerGroup.position.x,
                playerGroup.position.y + 1,
                playerGroup.position.z
            );
            const viewDir = playerPos.clone().sub(camPos);
            const viewLen = viewDir.length();
            viewDir.normalize();
            for (const p of platforms) {
                // 跳过第0层大地板（保持不透明）
                if (p.layer === 0) {
                    p.mesh.material.opacity = 1.0;
                    continue;
                }
                // 平台中心到视线射线的距离
                const platCenter = new THREE.Vector3(p.x, p.topY, p.z);
                const toPlat = platCenter.clone().sub(camPos);
                const proj = toPlat.dot(viewDir); // 投影长度
                let opacity = 1.0;
                if (proj > 0 && proj < viewLen) {
                    // 平台在相机和玩家之间
                    const closest = camPos.clone().add(viewDir.clone().multiplyScalar(proj));
                    const dist = platCenter.distanceTo(closest);
                    if (dist < 3) {
                        // 距离视线近 → 变透明
                        opacity = 0.25;
                    } else if (dist < 5) {
                        opacity = 0.5;
                    }
                }
                p.mesh.material.opacity = opacity;
            }

            // 相机跟随
            const camDist = 9;
            const camHeight = 4;
            const targetCamX = playerGroup.position.x - Math.sin(yaw) * camDist;
            const targetCamZ = playerGroup.position.z - Math.cos(yaw) * camDist;
            const targetCamY = playerGroup.position.y + camHeight;

            const smooth = 0.12;
            camera.position.x += (targetCamX - camera.position.x) * smooth;
            camera.position.z += (targetCamZ - camera.position.z) * smooth;
            camera.position.y += (targetCamY - camera.position.y) * smooth;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        // ============== 11. ESC 菜单 ==============
        let gamePaused = false;
        const escMenu = document.getElementById('escMenu');

        // 重新开始：重置玩家位置、层数、平台
        function restartGame() {
            // 重置玩家
            playerGroup.position.set(0, 0, 0);
            velY = 0;
            isGrounded = true;
            currentPlatform = null;
            yaw = 0;

            // 清除所有平台
            for (const p of platforms) {
                scene.remove(p.mesh);
                p.mesh.material.dispose();
            }
            platforms.length = 0;

            // 重新生成 0~5 层
            highestGeneratedLayer = 0;
            for (let l = 0; l <= 5; l++) {
                generateLayer(l);
                highestGeneratedLayer = l;
            }

            // 重置层数（保留最高记录）
            currentLayer = 0;
            updateLayerDisplay();
            // 重置岩浆与死亡状态
            resetLava();
            deathTimer = 0;
            deathPending = false;
            resetEscMenuText();
            playerGroup.visible = modelLoaded;
            // 重置死亡动画残留状态：模型旋转、材质 emissive
            if (deathModel) deathModel.rotation.set(0, 0, 0);
            deathMaterials.forEach((d) => {
                d.mat.emissive.setRGB(d.origEmissiveR, d.origEmissiveG, d.origEmissiveB);
                d.mat.emissiveIntensity = d.origEmissiveI;
            });
            // 恢复 idle 动画
            if (idleAction) {
                [walkAction, runAction, idleAction, jumpAction].forEach(a => {
                    if (a) a.fadeOut(0);
                });
                idleAction.reset().fadeIn(0.15).play();
                currentAnimation = 'idle';
            }

            closeEscMenu();
        }

        // 退出：回到开始界面
        function quitGame() {
            closeEscMenu();
            // 清理游戏状态
            restartGame();
            // 回到开始界面
            gameStarted = false;
            gamePaused = false;
            playerGroup.visible = false;
            document.getElementById('startOverlay').style.display = 'flex';
            document.querySelector('.tip').style.display = 'none';
            document.querySelector('.layer').style.display = 'none';
            startBtn.disabled = false;
            startBtn.textContent = '开始游戏';
            if (document.pointerLockElement) document.exitPointerLock();
            // 暂停背景音乐
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.pause();
        }

        function openEscMenu() {
            gamePaused = true;
            escMenu.style.display = 'flex';
            if (document.pointerLockElement) document.exitPointerLock();
        }

        function closeEscMenu() {
            gamePaused = false;
            escMenu.style.display = 'none';
        }

        // ESC / P 键开关暂停菜单
        document.addEventListener('keydown', (e) => {
            const isToggle = (e.key === 'Escape' || e.key === 'p' || e.key === 'P');
            if (!isToggle || !gameStarted) return;
            // 死亡菜单只能通过按钮关闭，不能用 ESC/P 关闭
            if (deathPending) return;
            // 死亡动画进行中也不允许乱切暂停，防止 deathTimer 卡在 gamePaused 分支
            if (deathTimer > 0) return;
            if (gamePaused) {
                closeEscMenu();
            } else {
                openEscMenu();
            }
        });

        document.getElementById('btnRestart').addEventListener('click', restartGame);
        document.getElementById('btnQuit').addEventListener('click', quitGame);

        // ============== 12. 开始按钮 ==============
        const startBtn = document.getElementById('startBtn');
        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            startBtn.textContent = '加载中...';
            loadModel();
        });

        // 启动渲染循环（游戏未开始时只渲染背景）
        animate();

        // ============== 11. 窗口适配 ==============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
