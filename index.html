<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>Jump Robot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        .tip {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 99;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }

        .layer {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #ffe66d;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 99;
            font-size: 28px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            text-align: right;
            line-height: 1.2;
        }

        .layer small {
            display: block;
            font-size: 12px;
            color: #aaa;
            font-weight: normal;
            margin-top: 4px;
        }

        .best {
            color: #6dff8e;
        }

        #startOverlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #fff;
        }

        #startOverlay h1 {
            font-size: 56px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffe66d, #ff6b6b, #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 230, 109, 0.3);
        }

        #startOverlay p {
            font-size: 16px;
            color: #aab;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.8;
        }

        #startBtn {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border: none;
            padding: 18px 60px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(238, 90, 111, 0.4);
        }

        #startBtn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(238, 90, 111, 0.6);
        }

        #startBtn:disabled {
            background: #555;
            cursor: wait;
            box-shadow: none;
        }

        #escMenu {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(6px);
        }

        #escMenu h2 {
            color: #fff;
            font-size: 36px;
            margin-bottom: 40px;
        }

        #escMenu button {
            display: block;
            width: 240px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border: none;
            padding: 16px 0;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        #btnRestart {
            background: linear-gradient(135deg, #4a90e2, #357abd);
        }

        #btnRestart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        #btnQuit {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }

        #btnQuit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(238, 90, 111, 0.4);
        }

        #escMenu .hint {
            color: #888;
            font-size: 13px;
            margin-top: 12px;
        }

        /* 背景音乐（隐藏，不可见） */
        #bgMusic {
            display: none;
        }
    </style>
</head>

<body>
    <!-- 背景音乐：进入游戏播放，退出游戏暂停 -->
    <audio id="bgMusic" src="assets/bg-music.mp4" loop preload="auto"></audio>

    <!-- 开始界面 -->
    <div id="startOverlay">
        <h1>Jump Robot</h1>
        <p>
            往上跳！随机平台不断生成，看你能跳多高<br>
            WASD 移动 | Shift 冲刺 | 空格跳跃 | 鼠标转视角<br>
            冲刺时跳跃更高更远，岩浆会从下方缓慢追上来，碰到就死
        </p>
        <button id="startBtn">开始游戏</button>
    </div>

    <!-- 游戏UI（加载完成后显示） -->
    <div class="tip" style="display:none;">
        点击锁定鼠标 | WASD移动 | Shift冲刺 | 空格跳跃 | 鼠标转视角 | ESC菜单 | 往上跳，别被岩浆追上
    </div>
    <div class="layer" style="display:none;">
        <span id="layerNow">0</span> 层
        <small>最高：<span id="layerBest" class="best">0</span> 层</small>
    </div>

    <!-- ESC菜单 -->
    <div id="escMenu">
        <h2>暂停</h2>
        <button id="btnRestart">重新开始</button>
        <button id="btnQuit">退出游戏</button>
        <div class="hint">按 ESC 关闭菜单继续游戏</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ============== 1. 场景初始化 ==============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ============== 2. 灯光 ==============
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(20, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -60;
        dirLight.shadow.camera.right = 60;
        dirLight.shadow.camera.top = 60;
        dirLight.shadow.camera.bottom = -60;
        scene.add(dirLight);

        // ============== 3. 平台系统 ==============
        const LAYER_HEIGHT = 3.0;          // 每层高度间隔
        const PLATFORM_SIZE = 5;           // 平台边长（加大，更易落脚）
        const PLATFORM_THICK = 0.5;        // 平台厚度
        const RANGE = 8;                   // 平台水平随机范围（加大，更分散）
        const PLATFORMS_PER_LAYER = 4;     // 每层平台数量（增多，更易跳）

        const platforms = [];
        const platformGeo = new THREE.BoxGeometry(PLATFORM_SIZE, PLATFORM_THICK, PLATFORM_SIZE);

        function layerColor(layer) {
            const palette = [
                0x4a90e2, 0x50c878, 0xf4a460, 0xff6b6b,
                0x9b59b6, 0x1abc9c, 0xe67e22, 0xecf0f1
            ];
            return palette[((layer % palette.length) + palette.length) % palette.length];
        }

        // 关键：topY = layer * LAYER_HEIGHT，第0层平台顶面在 y=0
        function createPlatform(layer, x, z, size = PLATFORM_SIZE) {
            const useGeo = (size === PLATFORM_SIZE) ? platformGeo : new THREE.BoxGeometry(size, PLATFORM_THICK, size);
            const mat = new THREE.MeshLambertMaterial({ 
                color: layerColor(layer),
                transparent: true,
                opacity: 1.0
            });
            const mesh = new THREE.Mesh(useGeo, mat);
            const topY = layer * LAYER_HEIGHT;
            mesh.position.set(x, topY - PLATFORM_THICK / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const half = size / 2;
            const p = {
                mesh,
                x, z, layer, size,
                topY,
                minX: x - half,
                maxX: x + half,
                minZ: z - half,
                maxZ: z + half
            };
            platforms.push(p);
            return p;
        }

        function generateLayer(layer) {
            if (layer === 0) {
                // 第 0 层大地面平台（50×50），玩家跑不出去，下面没有东西
                createPlatform(0, 0, 0, 50);
                return;
            }
            // 同层平台间最小间距（边到边），避免重叠
            const minGap = 1.5;
            const placed = []; // 记录本层已放置的平台中心
            let attempts = 0;
            while (placed.length < PLATFORMS_PER_LAYER && attempts < 30) {
                const x = (Math.random() * 2 - 1) * RANGE;
                const z = (Math.random() * 2 - 1) * RANGE;
                // 检查与已放置平台的间距
                let ok = true;
                for (const q of placed) {
                    const dx = Math.abs(x - q.x);
                    const dz = Math.abs(z - q.z);
                    // 边到边距离 = 中心距 - 两个半边长
                    if (dx < PLATFORM_SIZE + minGap && dz < PLATFORM_SIZE + minGap) {
                        ok = false;
                        break;
                    }
                }
                if (ok) {
                    createPlatform(layer, x, z);
                    placed.push({ x, z });
                }
                attempts++;
            }
            // 保底：如果尝试多次没放够，剩余的直接随机放（不重叠也比没平台强）
            while (placed.length < PLATFORMS_PER_LAYER) {
                const x = (Math.random() * 2 - 1) * RANGE;
                const z = (Math.random() * 2 - 1) * RANGE;
                createPlatform(layer, x, z);
                placed.push({ x, z });
            }
        }

        let highestGeneratedLayer = 0;
        let lowestGeneratedLayer = 0;
        for (let l = 0; l <= 5; l++) {
            generateLayer(l);
            highestGeneratedLayer = l;
        }

        // ============== 4. 玩家（Group + GLTF模型） ==============
        // 用 group 作为物理载体，position.y 即脚底高度
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0); // 第0层平台顶面 y=0
        playerGroup.visible = false; // 加载完成前隐藏
        scene.add(playerGroup);

        // 模型与动画
        let mixer = null;
        let walkAction = null, idleAction = null, jumpAction = null, runAction = null;
        let currentAnimation = 'idle';
        let modelLoaded = false;
        let gameStarted = false;

        // 加载模型（由开始按钮触发）
        function loadModel() {
            const loader = new GLTFLoader();
            loader.load(
                'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
                function (gltf) {
                    const model = gltf.scene;
                    model.scale.set(0.3, 0.3, 0.3);
                    model.castShadow = true;
                    playerGroup.add(model);
                    playerGroup.visible = true;

                    mixer = new THREE.AnimationMixer(model);
                    const animations = gltf.animations;

                    const find = (re) => animations.find(a => re.test(a.name.toLowerCase()));
                    const walkAnim = find(/walk|walking/);
                    const runAnim = find(/run|running/);
                    const idleAnim = find(/idle|standing/);
                    const jumpAnim = find(/jump|jumping/);

                    walkAction = mixer.clipAction(walkAnim || animations[0]);
                    runAction = mixer.clipAction(runAnim || walkAnim || animations[0]);
                    idleAction = mixer.clipAction(idleAnim || animations[0]);
                    jumpAction = mixer.clipAction(jumpAnim || animations[0]);

                    walkAction.setEffectiveWeight(1);
                    runAction.setEffectiveWeight(1);
                    idleAction.setEffectiveWeight(1);
                    jumpAction.setEffectiveWeight(1);
                    idleAction.play();

                    modelLoaded = true;
                    onModelReady();
                },
                (progress) => {
                    if (progress.total) {
                        const ratio = progress.loaded / progress.total;
                        const percent = Math.min(99, Math.floor(ratio * 100));
                        startBtn.textContent = `加载中... ${percent}%`;
                    }
                },
                function (error) {
                    console.error('模型加载失败：', error);
                    startBtn.textContent = '加载失败，点击重试';
                    startBtn.disabled = false;
                }
            );
        }

        // 模型加载完成 → 进入游戏
        function onModelReady() {
            gameStarted = true;
            // 隐藏开始界面
            document.getElementById('startOverlay').style.display = 'none';
            // 显示游戏UI
            document.querySelector('.tip').style.display = 'block';
            document.querySelector('.layer').style.display = 'block';
            // 播放背景音乐
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.currentTime = 0;
            bgMusic.play().catch(err => console.warn('背景音乐播放失败：', err));
        }

        // ============== 5. 控制系统 ==============
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        let yaw = 0;
        const mouseSens = 0.002;
        const moveSpeed = 8;
        const runSpeedMultiplier = 1.6;     // Shift 奔跑速度倍率
        const dashJumpMultiplier = 1.5;     // 奔跑时跳跃力倍率（冲刺跳更高更远）
        const gravity = -25;
        const jumpPower = 13;               // 普通跳跃力足够跳上一层
        let velY = 0;
        let isGrounded = true;
        let currentPlatform = null;

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            else if (k === 'a') keys.a = true;
            else if (k === 's') keys.s = true;
            else if (k === 'd') keys.d = true;
            else if (k === ' ') { keys.space = true; e.preventDefault(); }
            if (e.key === 'Shift') keys.shift = true;
        });

        document.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            else if (k === 'a') keys.a = false;
            else if (k === 's') keys.s = false;
            else if (k === 'd') keys.d = false;
            else if (k === ' ') keys.space = false;
            if (e.key === 'Shift') keys.shift = false;
        });

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * mouseSens;
            }
        });

        // ============== 6. 层数统计 ==============
        let currentLayer = 0;
        let bestLayer = 0;
        const layerNowEl = document.getElementById('layerNow');
        const layerBestEl = document.getElementById('layerBest');

        function updateLayerDisplay() {
            layerNowEl.textContent = currentLayer;
            layerBestEl.textContent = bestLayer;
        }
        updateLayerDisplay();

        // ============== 7. 动画状态切换 ==============
        function switchAnimation(target) {
            if (!modelLoaded || currentAnimation === target) return;
            const fade = 0.15;
            if (currentAnimation === 'walk') walkAction.fadeOut(fade);
            else if (currentAnimation === 'run') runAction.fadeOut(fade);
            else if (currentAnimation === 'idle') idleAction.fadeOut(fade);
            else if (currentAnimation === 'jump') jumpAction.fadeOut(fade);

            if (target === 'walk') walkAction.reset().fadeIn(fade).play();
            else if (target === 'run') runAction.reset().fadeIn(fade).play();
            else if (target === 'idle') idleAction.reset().fadeIn(fade).play();
            else if (target === 'jump') jumpAction.reset().fadeIn(fade).play();

            currentAnimation = target;
        }

        // ============== 8. 平台动态生成与清理 ==============
        function managePlatforms() {
            const playerLayerApprox = Math.round(playerGroup.position.y / LAYER_HEIGHT);

            // 只往上生成（第0层是地板，下面不再生成）
            // 生成 12 层以上的余量，保证跳跃时不会"空窗"
            while (highestGeneratedLayer < playerLayerApprox + 12) {
                highestGeneratedLayer++;
                generateLayer(highestGeneratedLayer);
            }

            // 关键修复：只清理玩家下方太远的平台（第0层除外）
            // 不清理玩家上方的平台 —— 这样即使掉回低层，之前生成的高层平台仍在
            const minKeepLayer = playerLayerApprox - 10;
            for (let i = platforms.length - 1; i >= 0; i--) {
                const p = platforms[i];
                if (p.layer < minKeepLayer && p.layer !== 0) {
                    scene.remove(p.mesh);
                    p.mesh.material.dispose();
                    platforms.splice(i, 1);
                }
            }
        }

        // ============== 9. 落地检测（前后帧穿越法） ==============
        // 上一帧脚底在平台顶面之上，本帧到顶面之下 → 落地
        function tryLanding(prevFootY, newFootY) {
            const px = playerGroup.position.x;
            const pz = playerGroup.position.z;
            let best = null;
            for (const p of platforms) {
                if (prevFootY >= p.topY - 0.01 && newFootY <= p.topY + 0.01) {
                    if (px >= p.minX - 0.3 && px <= p.maxX + 0.3 &&
                        pz >= p.minZ - 0.3 && pz <= p.maxZ + 0.3) {
                        if (!best || p.topY > best.topY) best = p;
                    }
                }
            }
            return best;
        }

        // ============== 9.5 岩浆系统 ==============
        // 参考 https://threelab.cn/articles/threejs-lava-flow
        // 用 fBm 噪声驱动的流动着色器做岩浆面，缓慢上升，碰到玩家即死亡
        const LAVA_SIZE = 100;             // 岩浆平面边长
        const LAVA_RISE_SPEED = 0.8;       // 每秒上升速度
        const LAVA_INITIAL_Y = -8;         // 起始高度（低于第0层平台）
        const LAVA_DEATH_MARGIN = 0.1;     // 玩家脚底低于岩浆面多少即判定死亡
        const DEATH_DURATION = 1.0;        // 死亡动画时长（秒）

        const lavaUniforms = { uTime: { value: 0 } };

        const lavaGeo = new THREE.PlaneGeometry(LAVA_SIZE, LAVA_SIZE, 1, 1);
        const lavaMat = new THREE.ShaderMaterial({
            uniforms: lavaUniforms,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldPos;
                void main() {
                    vUv = uv * 12.0;
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                varying vec3 vWorldPos;

                float noise(vec2 p) {
                    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                }

                float fbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    float frequency = 1.0;
                    for (int i = 0; i < 5; i++) {
                        value += amplitude * noise(p * frequency);
                        amplitude *= 0.5;
                        frequency *= 2.0;
                    }
                    return value;
                }

                vec3 lavaColor(float heat) {
                    vec3 coolColor = vec3(0.45, 0.08, 0.0);  // 暗红冷区
                    vec3 hotColor  = vec3(1.0, 0.85, 0.25);  // 亮黄热区
                    if (heat < 0.3) {
                        return coolColor;
                    } else if (heat < 0.6) {
                        return mix(coolColor, vec3(1.0, 0.5, 0.0), (heat - 0.3) / 0.3);
                    } else {
                        return mix(vec3(1.0, 0.5, 0.0), hotColor, (heat - 0.6) / 0.4);
                    }
                }

                void main() {
                    float t = uTime * 0.25;
                    vec2 flow = vec2(
                        fbm(vUv + t),
                        fbm(vUv - t * 0.7)
                    );
                    float heat = fbm(vUv + flow);
                    vec3 col = lavaColor(heat);
                    // 高热点加亮，模拟沸腾发光
                    col += vec3(0.4, 0.15, 0.0) * pow(heat, 3.0);
                    // 冷区压暗，形成硬壳纹理
                    col *= smoothstep(0.0, 0.15, heat) * 0.6 + 0.4;

                    // 边缘按水平距离淡出，融入远处雾气
                    float distXZ = length(vWorldPos.xz);
                    float alpha = 1.0 - smoothstep(30.0, 48.0, distXZ);
                    gl_FragColor = vec4(col, alpha);
                }
            `
        });

        const lavaMesh = new THREE.Mesh(lavaGeo, lavaMat);
        lavaMesh.rotation.x = -Math.PI / 2;
        lavaMesh.position.y = LAVA_INITIAL_Y;
        scene.add(lavaMesh);

        // 岩浆发出的红色辉光，照亮附近的平台与角色
        const lavaLight = new THREE.PointLight(0xff4400, 2.0, 60, 2);
        lavaLight.position.set(0, LAVA_INITIAL_Y + 2, 0);
        scene.add(lavaLight);

        let lavaY = LAVA_INITIAL_Y;
        let deathTimer = 0;   // 死亡动画倒计时，>0 表示正在死亡
        let deathPending = false;  // 死亡后已弹出菜单，等待玩家选择

        function resetLava() {
            lavaY = LAVA_INITIAL_Y;
            lavaMesh.position.y = lavaY;
            lavaLight.position.y = lavaY + 2;
            lavaUniforms.uTime.value = 0;
        }

        function updateLava(delta) {
            // 缓慢上升
            lavaY += LAVA_RISE_SPEED * delta;
            lavaMesh.position.y = lavaY;
            lavaLight.position.y = lavaY + 2;
            // 着色器时间推进，驱动流动动画
            lavaUniforms.uTime.value += delta;

            // 死亡检测：玩家脚底低于岩浆面
            if (gameStarted && !gamePaused && deathTimer <= 0 &&
                playerGroup.position.y < lavaY - LAVA_DEATH_MARGIN) {
                onPlayerDeath();
            }
        }

        function onPlayerDeath() {
            deathTimer = DEATH_DURATION;
            playerGroup.visible = false;
        }

        // 死亡动画结束后弹出菜单（替换自动重生）
        function openDeathMenu() {
            deathPending = true;
            escMenu.querySelector('h2').textContent = '你死了';
            escMenu.querySelector('.hint').textContent = '选择重新开始或退出游戏';
            openEscMenu();
        }

        // 恢复暂停菜单的默认文案
        function resetEscMenuText() {
            escMenu.querySelector('h2').textContent = '暂停';
            escMenu.querySelector('.hint').textContent = '按 ESC 关闭菜单继续游戏';
        }

        // ============== 10. 主循环 ==============
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            // 游戏未开始：只渲染静态场景（开始界面背景）
            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            // 暂停：只渲染不更新逻辑
            if (gamePaused) {
                renderer.render(scene, camera);
                return;
            }

            // 死亡动画期间：只更新岩浆流动视觉，不更新游戏逻辑
            if (deathTimer > 0) {
                deathTimer -= delta;
                lavaUniforms.uTime.value += delta;
                if (deathTimer <= 0) {
                    deathTimer = 0;
                    openDeathMenu();
                }
                renderer.render(scene, camera);
                return;
            }

            if (mixer) mixer.update(delta);

            // 移动方向
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw));
            const right = new THREE.Vector3(1, 0, 0);
            right.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw));

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.sub(forward);
            if (keys.s) moveDir.add(forward);
            if (keys.a) moveDir.add(right);
            if (keys.d) moveDir.sub(right);
            if (moveDir.length() > 0) moveDir.normalize();

            // 奔跑判定
            const isRunning = keys.shift && moveDir.length() > 0;
            const currentMoveSpeed = isRunning ? moveSpeed * runSpeedMultiplier : moveSpeed;

            // 水平移动
            playerGroup.position.x += moveDir.x * currentMoveSpeed * delta;
            playerGroup.position.z += moveDir.z * currentMoveSpeed * delta;

            // 玩家朝向（移动方向）—— RobotExpressive 默认朝 +Z，所以不加 PI
            if (moveDir.length() > 0) {
                const targetYaw = Math.atan2(moveDir.x, moveDir.z);
                let diff = targetYaw - playerGroup.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                playerGroup.rotation.y += diff * 0.2;
            }

            // 跳跃（奔跑时冲刺跳跃，跳更高更远）
            if (keys.space && isGrounded) {
                const mult = isRunning ? dashJumpMultiplier : 1;
                velY = jumpPower * mult;
                isGrounded = false;
                currentPlatform = null;
                switchAnimation('jump');
            }

            // 重力 + 落地检测
            const prevFootY = playerGroup.position.y;
            velY += gravity * delta;
            playerGroup.position.y += velY * delta;
            const newFootY = playerGroup.position.y;

            if (velY <= 0) {
                const landed = tryLanding(prevFootY, newFootY);
                if (landed) {
                    playerGroup.position.y = landed.topY;
                    velY = 0;
                    isGrounded = true;
                    currentPlatform = landed;
                    currentLayer = landed.layer;
                    if (currentLayer > bestLayer) bestLayer = currentLayer;
                    updateLayerDisplay();
                } else {
                    isGrounded = false;
                }
            } else {
                isGrounded = false;
            }

            // 动画切换
            if (isGrounded) {
                if (moveDir.length() > 0) {
                    switchAnimation(isRunning ? 'run' : 'walk');
                } else {
                    switchAnimation('idle');
                }
            }

            // 兜底：第0层是地板，万一掉到 y<0（穿出大平台边缘）就拉回第0层中心
            if (playerGroup.position.y < -0.5) {
                playerGroup.position.set(0, 0, 0);
                velY = 0;
                isGrounded = true;
                currentPlatform = platforms.find(p => p.layer === 0);
                currentLayer = 0;
                updateLayerDisplay();
            }

            // 平台动态管理
            managePlatforms();

            // 岩浆上升与死亡检测
            updateLava(delta);

            // 视线遮挡检测：相机和玩家之间的平台变半透明
            const camPos = camera.position.clone();
            const playerPos = new THREE.Vector3(
                playerGroup.position.x,
                playerGroup.position.y + 1,
                playerGroup.position.z
            );
            const viewDir = playerPos.clone().sub(camPos);
            const viewLen = viewDir.length();
            viewDir.normalize();
            for (const p of platforms) {
                // 跳过第0层大地板（保持不透明）
                if (p.layer === 0) {
                    p.mesh.material.opacity = 1.0;
                    continue;
                }
                // 平台中心到视线射线的距离
                const platCenter = new THREE.Vector3(p.x, p.topY, p.z);
                const toPlat = platCenter.clone().sub(camPos);
                const proj = toPlat.dot(viewDir); // 投影长度
                let opacity = 1.0;
                if (proj > 0 && proj < viewLen) {
                    // 平台在相机和玩家之间
                    const closest = camPos.clone().add(viewDir.clone().multiplyScalar(proj));
                    const dist = platCenter.distanceTo(closest);
                    if (dist < 3) {
                        // 距离视线近 → 变透明
                        opacity = 0.25;
                    } else if (dist < 5) {
                        opacity = 0.5;
                    }
                }
                p.mesh.material.opacity = opacity;
            }

            // 相机跟随
            const camDist = 9;
            const camHeight = 4;
            const targetCamX = playerGroup.position.x - Math.sin(yaw) * camDist;
            const targetCamZ = playerGroup.position.z - Math.cos(yaw) * camDist;
            const targetCamY = playerGroup.position.y + camHeight;

            const smooth = 0.12;
            camera.position.x += (targetCamX - camera.position.x) * smooth;
            camera.position.z += (targetCamZ - camera.position.z) * smooth;
            camera.position.y += (targetCamY - camera.position.y) * smooth;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        // ============== 11. ESC 菜单 ==============
        let gamePaused = false;
        const escMenu = document.getElementById('escMenu');

        // 重新开始：重置玩家位置、层数、平台
        function restartGame() {
            // 重置玩家
            playerGroup.position.set(0, 0, 0);
            velY = 0;
            isGrounded = true;
            currentPlatform = null;
            yaw = 0;

            // 清除所有平台
            for (const p of platforms) {
                scene.remove(p.mesh);
                p.mesh.material.dispose();
            }
            platforms.length = 0;

            // 重新生成 0~5 层
            highestGeneratedLayer = 0;
            for (let l = 0; l <= 5; l++) {
                generateLayer(l);
                highestGeneratedLayer = l;
            }

            // 重置层数（保留最高记录）
            currentLayer = 0;
            updateLayerDisplay();
            // 重置岩浆与死亡状态
            resetLava();
            deathTimer = 0;
            deathPending = false;
            resetEscMenuText();
            playerGroup.visible = modelLoaded;

            closeEscMenu();
        }

        // 退出：回到开始界面
        function quitGame() {
            closeEscMenu();
            // 清理游戏状态
            restartGame();
            // 回到开始界面
            gameStarted = false;
            gamePaused = false;
            playerGroup.visible = false;
            document.getElementById('startOverlay').style.display = 'flex';
            document.querySelector('.tip').style.display = 'none';
            document.querySelector('.layer').style.display = 'none';
            startBtn.disabled = false;
            startBtn.textContent = '开始游戏';
            if (document.pointerLockElement) document.exitPointerLock();
            // 暂停背景音乐
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.pause();
        }

        function openEscMenu() {
            gamePaused = true;
            escMenu.style.display = 'flex';
            if (document.pointerLockElement) document.exitPointerLock();
        }

        function closeEscMenu() {
            gamePaused = false;
            escMenu.style.display = 'none';
        }

        // ESC 键开关菜单
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameStarted) {
                // 死亡菜单只能通过按钮关闭，不能用 ESC 关闭
                if (deathPending) return;
                if (gamePaused) {
                    closeEscMenu();
                } else {
                    openEscMenu();
                }
            }
        });

        document.getElementById('btnRestart').addEventListener('click', restartGame);
        document.getElementById('btnQuit').addEventListener('click', quitGame);

        // ============== 12. 开始按钮 ==============
        const startBtn = document.getElementById('startBtn');
        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            startBtn.textContent = '加载中...';
            loadModel();
        });

        // 启动渲染循环（游戏未开始时只渲染背景）
        animate();

        // ============== 11. 窗口适配 ==============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>

</html>
